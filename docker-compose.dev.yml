services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: lifepilot
      POSTGRES_USER: lifepilot
      POSTGRES_PASSWORD: lifepilot
    ports:
      - "5433:5432"
    volumes:
      - lifepilot_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lifepilot -d lifepilot"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6382:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  lifepilot_pg:
